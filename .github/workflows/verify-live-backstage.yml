name: Verify live Backstage publication

on:
  push:
    branches: [main]
    paths:
      - "src/backstage/**"
      - "src/App.tsx"
      - "netlify.toml"
      - ".github/workflows/verify-live-backstage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-backstage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that Netlify serves the latest violin entry
        shell: bash
        run: |
          set -uo pipefail
          page="https://joepearson.music/backstage"
          for attempt in 1 2 3 4 5 6; do
            echo "Live site check ${attempt}/6: ${page}"
            status=$(curl --location --silent --show-error --max-time 15 \
              --output /tmp/backstage.html --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache' \
              "${page}?verify=${GITHUB_SHA}" || true)
            echo "HTTP status: ${status:-unavailable}"
            if [[ "${status}" == "200" ]] && grep -q '2026-11-23-violin-fingerboard' /tmp/backstage.html; then
              echo "PASS: the published Backstage HTML includes the violin grid."
              exit 0
            fi
            if [[ "${attempt}" -lt 6 ]]; then sleep 15; fi
          done
          echo "::error::GitHub builds passed, but the live Netlify site is not serving the violin entry."
          echo "Inspect the Netlify production deployment and verify it uses main and npm run build."
          exit 1
