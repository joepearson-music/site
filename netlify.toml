[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Backstage is intentionally public, indexable and served with pre-rendered HTML.
# The page contains its full text even when a crawler does not run JavaScript.
[[headers]]
  for = "/backstage"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/backstage/"
  [headers.values]
    X-Robots-Tag = "index, follow"
