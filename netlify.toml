[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Backstage is accessible by direct link but excluded from search indexing.
[[headers]]
  for = "/backstage"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/backstage/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Research is unlisted: retain direct-link access, discourage search indexing.
[[headers]]
  for = "/research*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The standalone violin test route is likewise unlisted.
[[headers]]
  for = "/backstage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
